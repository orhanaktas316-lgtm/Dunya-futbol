<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Canlı Futbol</title>
<style>
:root{color-scheme:dark;--bg:#0b1118;--card:#151f2a;--muted:#9aabba;--accent:#26d07c;--line:#263442}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:26px 18px 18px;background:linear-gradient(145deg,#123a2b,#101820 70%);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:27px}header p{margin:7px 0 0;color:#b7c7c1;font-size:13px}
main{max-width:760px;margin:auto;padding:16px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}
select,button{font:inherit;border:1px solid var(--line);border-radius:12px;background:var(--card);color:#fff;padding:12px}
select{flex:1;min-width:0}button{cursor:pointer}
#refresh{background:#1b7c50;border-color:#1b7c50;font-weight:650}
.info{font-size:12px;color:var(--muted);margin:0 2px 14px}
#status{padding:12px 14px;border-radius:12px;background:#18232e;color:#c5d1dc;margin-bottom:12px;font-size:13px}
.match{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}
.matchtop{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:12px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.team{font-weight:650;line-height:1.3}.team:last-child{text-align:right}
.score{font-size:21px;font-weight:800;white-space:nowrap}
.live{color:var(--accent);font-weight:750}.muted{color:var(--muted)}
.empty{text-align:center;padding:32px 12px;color:var(--muted)}
footer{color:#788896;font-size:11px;line-height:1.5;text-align:center;padding:22px 8px}
</style>
</head>
<body>
<header><h1>⚽ Canlı Futbol</h1><p>Canlı skorlar · Maç programı · Otomatik yenileme</p></header>
<main>
<div class="toolbar">
<select id="league" aria-label="Lig seç">
<option value="tur.1">🇹🇷 Süper Lig</option>
<option value="eng.1">🏴 Premier League</option>
<option value="esp.1">🇪🇸 La Liga</option>
<option value="ger.1">🇩🇪 Bundesliga</option>
<option value="ita.1">🇮🇹 Serie A</option>
<option value="fra.1">🇫🇷 Ligue 1</option>
<option value="uefa.champions">🏆 Şampiyonlar Ligi</option>
</select>
<button id="refresh">Yenile ↻</button>
</div>
<p class="info" id="updated">Maçlar yükleniyor…</p>
<div id="status" role="status">Skorlar alınıyor…</div>
<section id="games"></section>
<footer>Veriler ESPN’in herkese açık skor akışından alınır. Bu ücretsiz kaynak resmî bir geliştirici API’si değildir; kapsam ve erişilebilirlik değişebilir. Sayfa yaklaşık 60 saniyede bir yenilenir.</footer>
</main>
<script>
const league=document.getElementById('league'), gamesEl=document.getElementById('games');
const statusEl=document.getElementById('status'), updatedEl=document.getElementById('updated');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function localDate(){
 const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
 return `${y}${m}${day}`;
}
function timeOf(event){
 const raw=event.date ? new Date(event.date) : null;
 return raw && !isNaN(raw) ? raw.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}) : '';
}
function render(events){
 if(!events.length){gamesEl.innerHTML='<div class="empty">Bu lig için bugün listelenen maç bulunamadı.</div>';return;}
 gamesEl.innerHTML=events.map(e=>{
  const comp=e.competitions?.[0], sides=comp?.competitors||[];
  const home=sides.find(x=>x.homeAway==='home')||sides[0]||{};
  const away=sides.find(x=>x.homeAway==='away')||sides[1]||{};
  const h=home.team?.displayName||'Ev sahibi', a=away.team?.displayName||'Deplasman';
  const hs=home.score??'–', as=away.score??'–';
  const t=e.status?.type||{}, state=t.state||'pre';
  const detail=t.shortDetail||t.detail||timeOf(e);
  const label=state==='in'?'CANLI':state==='post'?'BİTTİ':(timeOf(e)||'PROGRAMDA');
  return `<article class="match"><div class="matchtop"><span>${esc(e.name||'')}</span><span class="${state==='in'?'live':'muted'}">${esc(label)}${detail && state==='in'?' · '+esc(detail):''}</span></div><div class="teams"><div class="team">${esc(h)}</div><div class="score">${esc(hs)} : ${esc(as)}</div><div class="team">${esc(a)}</div></div></article>`;
 }).join('');
}
async function load(){
 const code=league.value;
 statusEl.textContent='Maçlar alınıyor…';
 try{
  const url=`https://site.api.espn.com/apis/site/v2/sports/soccer/${encodeURIComponent(code)}/scoreboard?dates=${localDate()}`;
  const response=await fetch(url,{cache:'no-store'});
  if(!response.ok) throw new Error(`Sunucu yanıtı: ${response.status}`);
  const data=await response.json();
  const events=Array.isArray(data.events)?data.events:[];
  render(events);
  const live=events.filter(e=>e.status?.type?.state==='in').length;
  statusEl.textContent=events.length?`${events.length} maç bulundu · ${live} canlı maç`:'Bugün bu ligde maç görünmüyor.';
  updatedEl.textContent='Son kontrol: '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
 }catch(err){
  gamesEl.innerHTML='<div class="empty">Skor akışına şu anda ulaşılamıyor. Biraz sonra tekrar deneyin.</div>';
  statusEl.textContent='Bağlantı hatası: '+err.message;
  updatedEl.textContent='Son deneme: '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
 }
}
league.addEventListener('change',load);
document.getElementById('refresh').addEventListener('click',load);
load(); setInterval(load,60000);
</script>
</body></html>
